# Release configuration for mod-tools.
# Shared settings come from the preset, which ships inside the gem.
#
# Inspect what this actually resolves to:
#   mod-tools print-config

extends:  jotunn
assembly: Auga

# This repository predates the tool and spells the version constant its own way (Auga.Version).
version_const: Version

# Compiled against Newtonsoft.Json, installed as the shared Thunderstore package rather than shipped.
dependency_map:
  Newtonsoft.Json: ValheimModding-JsonDotNET

# The Thunderstore/Hexium team these publish under.
author_name: RandyKnapp

# Off for now. Deploy copies every build into all the profiles listed in this
# machine's mod-tools config.yml, and Auga replaces the whole UI: in a shared
# test profile it changes what every other mod is tested against, and mods
# such as MyLittleUI refuse to load beside it. Turn it on once config.yml
# points at a profile meant for Auga.
deploy:
  enabled: true
